name: yt-ingest

# Push-path trigger: updating ingest/queue.txt on the session branch runs this
# workflow on a GitHub runner (full internet). It downloads the listed YouTube
# videos and pushes them to the orphan branch `ingest/media`, which the
# sandbox then fetches via plain git (github.com is allowlisted there).
#
# queue.txt format:
#   line 1 : folder name under ingest/
#   line 2+: one YouTube URL per line
on:
  push:
    paths:
      - "ingest/queue.txt"
      - ".github/workflows/yt-ingest.yml"
  workflow_dispatch:
    inputs:
      urls:
        description: "YouTube URLs, one per line"
        required: false
        type: string
      folder:
        description: "Subfolder under ingest/"
        required: false
        default: "batch1"
        type: string

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve queue
        id: q
        run: |
          exec > >(tee /tmp/push.log) 2>&1
          set -x
          if [ "${{ github.event_name }}" = "push" ]; then
            FOLDER=$(head -n 1 ingest/queue.txt)
            URLS=$(tail -n +2 ingest/queue.txt)
          else
            FOLDER="${{ inputs.folder }}"
            URLS="${{ inputs.urls }}"
          fi
          echo "folder=$FOLDER" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$URLS" > /tmp/urls.txt
          grep -c . /tmp/urls.txt || true

      - name: Download videos
        run: |
          exec > >(tee -a /tmp/push.log) 2>&1
          set -x
          [ -s /tmp/urls.txt ] || tail -n +2 ingest/queue.txt > /tmp/urls.txt
          echo "--- urls.txt:"; cat -A /tmp/urls.txt | head -40; wc -l /tmp/urls.txt
          python3 -m pip install --user -q yt-dlp || python3 -m pip install -q yt-dlp || true
          python3 -m yt_dlp --version || true
          mkdir -p "out/${{ steps.q.outputs.folder }}"
          # ---- transcripts (source scripts) via youtube-transcript-api
          python3 -m pip install --user -q youtube-transcript-api || true
          mkdir -p "out/${{ steps.q.outputs.folder }}/transcripts"
          awk 'NF{n++; printf "%02d %s\n", n, $0}' /tmp/urls.txt | while read -r n url; do
            ID=$(echo "$url" | grep -oE "[A-Za-z0-9_-]{11}" | tail -1)
            python3 -m youtube_transcript_api "$ID" --languages en --languages hi --languages ur \
              > "out/${{ steps.q.outputs.folder }}/transcripts/$ID.txt" \
              2> "out/${{ steps.q.outputs.folder }}/transcripts/$ID.err" || true
            wc -c "out/${{ steps.q.outputs.folder }}/transcripts/$ID.txt" || true
          done
          # ---- BotGuard PO-token provider (bgutil) for yt-dlp
          git clone --depth=1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider /tmp/pot || true
          if [ -d /tmp/pot/server ]; then
            (cd /tmp/pot/server && npm ci --no-audit --no-fund --silent && npm run build --silent && nohup node build/main.js > /tmp/pot.log 2>&1 & )
            sleep 8; curl -s -m 3 http://localhost:4416/ping || true
          fi
          PDIR=$(python3 -c "import site;print(site.getusersitepackages())")/yt_dlp_plugins
          mkdir -p "$PDIR"
          if [ -d /tmp/pot/plugin/yt_dlp_plugins ]; then cp -r /tmp/pot/plugin/yt_dlp_plugins/* "$PDIR"/;
          elif [ -d /tmp/pot/yt_dlp_plugins ]; then cp -r /tmp/pot/yt_dlp_plugins/* "$PDIR"/; fi
          ls -R "$PDIR" | head -10 || true
          awk 'NF{n++; printf "%02d %s\n", n, $0}' /tmp/urls.txt | while read -r n url; do
            echo "::group::[$n] $url"
            bash scripts/ytget.sh "$url" "out/${{ steps.q.outputs.folder }}/${n}_${url##*=}.mp4" \
            || echo "FAILED [$n] $url" >> "out/${{ steps.q.outputs.folder }}/_failures.txt"
            echo "::endgroup::"
          done
          ls -la "out/${{ steps.q.outputs.folder }}"

      - name: Push to orphan branch ingest/media
        env:
          FOLDER: ${{ steps.q.outputs.folder }}
        run: |
          exec > >(tee -a /tmp/push.log) 2>&1
          set -x
          report() {
            RC=$?
            cd "$GITHUB_WORKSPACE" || exit $RC
            git config user.name "arena-ingest" 2>/dev/null || true
            git config user.email "arena-ingest@users.noreply.github.com" 2>/dev/null || true
            cp /tmp/push.log ingest/last-run.log 2>/dev/null || true
            git add -f ingest/last-run.log 2>/dev/null || true
            git commit -q -m "ci: ingest log run $GITHUB_RUN_ID (rc=$RC)" 2>/dev/null || true
            git push -q origin "HEAD:$GITHUB_REF_NAME" 2>/dev/null || true
            exit $RC
          }
          trap report EXIT
          echo "FOLDER=[$FOLDER]"; ls -la out/ "out/$FOLDER" || true
          git init pushdir
          cd pushdir
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git config user.name "arena-ingest"
          git config user.email "arena-ingest@users.noreply.github.com"
          if git fetch --depth=1 origin ingest/media; then
            git checkout -B ingest/media origin/ingest/media
          else
            git checkout --orphan ingest/media
          fi
          mkdir -p ingest
          cp -r "../out/$FOLDER" "ingest/$FOLDER"
          git add -A ingest
          git status --porcelain | head -20
          git commit -m "ingest: $FOLDER (run ${{ github.run_id }})"
          git rev-parse HEAD
          git push -v origin HEAD:refs/heads/ingest/media
